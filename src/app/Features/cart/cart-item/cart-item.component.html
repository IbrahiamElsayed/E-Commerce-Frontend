<div class="group rounded-xl border border-gray-200 bg-white p-5 shadow-sm transition hover:shadow-md">
  <div class="flex items-center gap-5">

    <!-- Product Image -->
    <a
      [routerLink]="['/shop', item().productId]"
      class="shrink-0 overflow-hidden rounded-lg"
    >
      <img
        [src]="item().pictureUrl"
        [alt]="item().productName"
        class="h-24 w-24 object-cover transition-transform duration-300 group-hover:scale-105"
      />
    </a>

    <!-- Product Info -->
    <div class="min-w-0 flex-1">
      <a
        [routerLink]="['/shop', item().productId]"
        class="block truncate font-semibold text-gray-900 transition hover:text-blue-700"
      >
        {{ item().productName }}
      </a>
      <p class="mt-1 text-sm text-gray-500">
        {{ item().brand }}
        <span class="mx-1 text-gray-300">|</span>
        {{ item().type }}
      </p>
      <p class="mt-1 text-sm font-medium text-gray-700">
        {{ item().price | currency }}
        <span class="font-normal text-gray-400">each</span>
      </p>
    </div>

    <!-- Quantity Stepper -->
    <div class="flex items-center rounded-full border border-gray-200 bg-gray-50 px-1 py-0.5">
      <button
        mat-icon-button
        class="!h-9 !w-9"
        (click)="decrementQuentity()"
        aria-label="Decrease quantity"
      >
        <mat-icon class="!text-lg">remove</mat-icon>
      </button>

      <span class="w-8 text-center text-base font-semibold text-gray-900">
        {{ item().quantity }}
      </span>

      <button
        mat-icon-button
        class="!h-9 !w-9"
        (click)="incrementQuantity()"
        aria-label="Increase quantity"
      >
        <mat-icon class="!text-lg">add</mat-icon>
      </button>
    </div>

    <!-- Line Total -->
    <div class="w-32 shrink-0 text-right">
      <p class="text-lg font-bold text-gray-900">
        {{ item().price * item().quantity | currency }}
      </p>
    </div>

    <!-- Remove -->
    <button
      mat-icon-button
      class="shrink-0 !text-red-500 transition hover:!text-red-700"
      (click)="removeItemFromCart()"
      aria-label="Remove item"
    >
      <mat-icon>delete_outline</mat-icon>
    </button>

  </div>
</div>
