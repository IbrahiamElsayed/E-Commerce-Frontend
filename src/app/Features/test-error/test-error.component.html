<div class="mt-5 flex justify-center gap-4">
  <button mat-stroked-button (click)="get500Error()">Test500Error</button>
  <button mat-stroked-button (click)="get404Error()">Test404Error</button>
  <button mat-stroked-button (click)="get400Error()">Test400Error</button>
  <button mat-stroked-button (click)="get401Error()">Test401Error</button>
  <button mat-stroked-button (click)="get400ValidationError()">Testvalidationerror</button>
</div>

@if (validationErrors().length > 0) {
  <div class="mx-auto mt-5 max-w-lg">
    <ul>
      @for (error of validationErrors(); track $index) {
        <li class="text-red-800">{{ error }}</li>
      }
    </ul>
  </div>
}
