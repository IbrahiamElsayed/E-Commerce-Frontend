<header class="fixed top-0 left-0 right-0 z-50 w-full bg-white shadow-md p-3">
  <div class="flex items-center justify-between max-w-7xl mx-auto">

    <img routerLink="/" src="/images/logo.png" alt="App Logo" class="max-h-16">

    <nav class="flex gap-3 my-2 uppercase text-2xl">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{exact:true}">
        Home
      </a>

      <a routerLink="/shop" routerLinkActive="active">
        Shop
      </a>

      <a routerLink="/test-error" routerLinkActive="active">
        Errors
      </a>
    </nav>

    <div class="flex gap-3 items-center">

      <a
        routerLink="/cart"
        routerLinkActive="active"
        [matBadge]="cartService.itemCount() || 0"
        [matBadgeHidden]="!cartService.itemCount()"
        matBadgeSize="large"
        class="custom-badge mt-2 mr-2">

        <mat-icon>shopping_cart</mat-icon>

      </a>

      @if (accountService.currentUser()) {

        <button mat-button [matMenuTriggerFor]="menu">

          <mat-icon>arrow_drop_down</mat-icon>

          <span>
            {{ accountService.currentUser()?.email }}
          </span>

        </button>

      } @else {

        <button
          routerLink="/account/login"
          mat-stroked-button>
          Login
        </button>

        <button
          routerLink="/account/register"
          mat-raised-button>
          Register
        </button>

      }

    </div>

  </div>
</header>

@if (busyService.loading) {
  <mat-progress-bar></mat-progress-bar>
}

<mat-menu #menu="matMenu">

  <button
    mat-menu-item
    class="px-3"
    routerLink="/cart">

    <mat-icon>shopping_cart</mat-icon>
    My cart

  </button>

  <button
    mat-menu-item
    class="px-3"
    routerLink="/orders">

    <mat-icon>history</mat-icon>
    My orders

  </button>

  <mat-divider></mat-divider>

  <button
    mat-menu-item
    class="px-3"
    (click)="logOut()">

    <mat-icon>logout</mat-icon>
    logout

  </button>

</mat-menu>
