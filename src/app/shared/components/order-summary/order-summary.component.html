<div class="overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm">

  <div class="border-b border-gray-100 bg-gray-50 px-6 py-4">
    <p class="text-lg font-semibold text-gray-900">Order Summary</p>
  </div>

  <div class="space-y-4 p-6">

    <dl class="flex items-center justify-between">
      <dt class="text-gray-500">Subtotal</dt>
      <dd class="font-semibold text-gray-900">{{ cartService.totals()?.subtotal | currency }}</dd>
    </dl>

    <dl class="flex items-center justify-between">
      <dt class="text-gray-500">Discount</dt>
      <dd class="font-semibold text-green-600">-{{ cartService.totals()?.discount | currency }}</dd>
    </dl>

    <dl class="flex items-center justify-between">
      <dt class="text-gray-500">Delivery fee</dt>
      <dd class="font-semibold text-gray-900">{{ cartService.totals()?.shipping | currency }}</dd>
    </dl>

    <div class="border-t border-dashed border-gray-200 pt-4">
      <dl class="flex items-center justify-between">
        <dt class="text-lg font-semibold text-gray-900">Total</dt>
        <dd class="text-xl font-bold text-blue-700">{{ cartService.totals()?.total | currency }}</dd>
      </dl>
    </div>

    <div class="flex flex-col gap-3 pt-2">
      <button routerLink="/checkout" mat-flat-button class="!rounded-lg !py-6">
        Checkout
      </button>
      <button routerLink="/shop" mat-stroked-button class="!rounded-lg !py-6">
        Continue Shopping
      </button>
    </div>

  </div>

  <div class="border-t border-gray-100 bg-gray-50 p-6">
    <label class="block text-sm font-medium text-gray-700">
      Do you have a voucher code?
    </label>
    <div class="mt-3 flex items-center gap-2">
      <mat-form-field appearance="outline" class="flex-1 !mb-0">
        <mat-label>Voucher code</mat-label>
        <input type="text" matInput />
      </mat-form-field>
      <button mat-flat-button class="!rounded-lg shrink-0">Apply</button>
    </div>
  </div>

</div>
